<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Kalkulyator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.js"></script>
<style>
:root{
  --bg:#0f1220;--panel:#171b2e;--panel2:#1f2440;--text:#e8eaf6;--muted:#9aa0c3;
  --accent:#6c8cff;--accent2:#42d6a4;--danger:#ff6b81;--border:#2b3156;--key:#232947;--keyh:#2d3460;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 8px;max-width:1100px;margin:auto}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--muted);font-size:13px}
nav{display:flex;flex-wrap:wrap;gap:6px;max-width:1100px;margin:10px auto 0;padding:0 16px}
nav button{background:var(--panel);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1100px;margin:12px auto 40px;padding:0 16px}
.tab{display:none}.tab.active{display:block}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;color:var(--muted);font-size:13px;margin:8px 0 4px}
input[type=text],textarea,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:16px/1.4 ui-monospace,Consolas,monospace;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-size:14px}
.btn.alt{background:var(--key);border:1px solid var(--border)}
.btn:hover{filter:brightness(1.15)}
.out{margin-top:12px;background:var(--panel2);border-radius:10px;padding:12px;min-height:44px;overflow-x:auto;word-break:break-word}
.out .err{color:var(--danger)}
.out .ok{color:var(--accent2);font-weight:600}
.out h4{margin:10px 0 4px;color:var(--muted);font-size:13px;font-weight:500}
.out h4:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--key);border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:3px 10px;font:12px ui-monospace,Consolas,monospace;cursor:pointer}
.chip:hover{color:var(--text)}
.keypad{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.keypad button{background:var(--key);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px 0;font-size:16px;cursor:pointer}
.keypad button:hover{background:var(--keyh)}
.keypad .op{color:var(--accent)}
.keypad .eq{background:var(--accent);color:#fff;border-color:var(--accent)}
.keypad .clr{color:var(--danger)}
#calcDisplay{font-size:24px;text-align:right;color:var(--accent2);min-height:36px;margin-top:8px;word-break:break-all}
.hist{max-height:260px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.hist div{padding:6px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.hist div:hover{background:var(--panel2)}
.hist b{color:var(--accent2);font-weight:500}
table{border-collapse:collapse;width:100%}
td{padding:6px 8px;border-bottom:1px solid var(--border)}
td:first-child{color:var(--muted);width:45%}
canvas{width:100%;height:460px;background:#0b0e1a;border-radius:10px;display:block;cursor:grab;touch-action:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toggle{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.toggle button{background:var(--key);color:var(--muted);border:0;padding:6px 12px;cursor:pointer}
.toggle button.on{background:var(--accent);color:#fff}
.katex-display{margin:.3em 0;text-align:left}
.katex-display>.katex{text-align:left}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.keypad{grid-template-columns:repeat(5,1fr)}canvas{height:340px}}
</style>
</head>
<body>
<header>
  <h1>🧮 Super Kalkulyator</h1>
  <p>Arifmetika · tenglamalar · sistemalar · hosila · integral · limit · soddalashtirish · grafik · matritsa · statistika · sonlar nazariyasi · birliklar</p>
</header>
<nav id="nav">
  <button data-t="calc" class="active">Kalkulyator</button>
  <button data-t="solve">Tenglama</button>
  <button data-t="calculus">Hosila / Integral / Limit</button>
  <button data-t="algebra">Soddalashtirish</button>
  <button data-t="graph">Grafik</button>
  <button data-t="matrix">Matritsa</button>
  <button data-t="stats">Statistika</button>
  <button data-t="number">Sonlar</button>
</nav>
<main>

<!-- KALKULYATOR -->
<section class="tab active" id="tab-calc">
  <div class="grid2">
    <div class="card">
      <div class="row" style="align-items:center">
        <div style="flex:3"><input type="text" id="calcIn" placeholder="Masalan: 2^10 + sqrt(16) * sin(30)" autocomplete="off"></div>
        <div style="flex:0;min-width:auto" class="toggle" id="angle"><button data-a="deg" class="on">DEG</button><button data-a="rad">RAD</button></div>
      </div>
      <div id="calcDisplay"></div>
      <div class="keypad" id="keypad"></div>
      <div class="chips" id="calcEx"></div>
    </div>
    <div class="card">
      <label style="margin-top:0">Natija</label>
      <div class="out" id="calcOut">Ifoda kiriting va Enter bosing.</div>
      <label>Tarix (bosib qayta ishlatish mumkin)</label>
      <div class="hist" id="hist"></div>
    </div>
  </div>
</section>

<!-- TENGLAMA -->
<section class="tab" id="tab-solve">
  <div class="card">
    <label style="margin-top:0">Tenglama yoki tenglamalar sistemasi (har birini yangi qatorda yoki <code>;</code> bilan)</label>
    <textarea id="solveIn" placeholder="x^2 - 5x + 6 = 0"></textarea>
    <div class="row">
      <div><label>O'zgaruvchi (ixtiyoriy)</label><input type="text" id="solveVar" placeholder="avtomatik"></div>
    </div>
    <div class="btns"><button class="btn" id="solveBtn">Yechish</button></div>
    <div class="chips" id="solveEx"></div>
    <div class="out" id="solveOut"></div>
  </div>
</section>

<!-- CALCULUS -->
<section class="tab" id="tab-calculus">
  <div class="card">
    <label style="margin-top:0">Funksiya f(x)</label>
    <input type="text" id="cfIn" placeholder="x^3 * sin(x)">
    <div class="row">
      <div><label>O'zgaruvchi</label><input type="text" id="cfVar" value="x"></div>
      <div><label>Hosila tartibi</label><input type="text" id="cfN" value="1"></div>
      <div><label>Quyi chegara a</label><input type="text" id="cfA" placeholder="ixtiyoriy"></div>
      <div><label>Yuqori chegara b</label><input type="text" id="cfB" placeholder="ixtiyoriy"></div>
      <div><label>Limit nuqtasi</label><input type="text" id="cfL" placeholder="0, Infinity"></div>
    </div>
    <div class="btns">
      <button class="btn" data-c="diff">Hosila</button>
      <button class="btn" data-c="int">Integral</button>
      <button class="btn" data-c="lim">Limit</button>
      <button class="btn alt" data-c="taylor">Teylor qatori</button>
      <button class="btn alt" data-c="extrema">Ekstremumlar</button>
    </div>
    <div class="chips" id="cfEx"></div>
    <div class="out" id="cfOut"></div>
  </div>
</section>

<!-- ALGEBRA -->
<section class="tab" id="tab-algebra">
  <div class="card">
    <label style="margin-top:0">Ifoda</label>
    <input type="text" id="alIn" placeholder="(x+1)^3 - (x-1)^3">
    <div class="btns">
      <button class="btn" data-g="simplify">Soddalashtirish</button>
      <button class="btn" data-g="expand">Qavslarni ochish</button>
      <button class="btn" data-g="factor">Ko'paytuvchilarga ajratish</button>
      <button class="btn alt" data-g="partfrac">Sodda kasrlarga</button>
      <button class="btn alt" data-g="eval">Qiymatini hisoblash</button>
    </div>
    <div class="chips" id="alEx"></div>
    <div class="out" id="alOut"></div>
  </div>
</section>

<!-- GRAFIK -->
<section class="tab" id="tab-graph">
  <div class="card">
    <label style="margin-top:0">Funksiyalar (<code>;</code> bilan ajrating). Sichqoncha bilan suring, g'ildirak bilan kattalashtiring.</label>
    <div class="row">
      <div style="flex:4"><input type="text" id="gIn" value="sin(x); x^2/10; 2*cos(x)"></div>
      <div style="flex:0;min-width:auto"><button class="btn" id="gBtn">Chizish</button></div>
      <div style="flex:0;min-width:auto"><button class="btn alt" id="gReset">Markaz</button></div>
    </div>
    <div style="margin-top:10px"><canvas id="cv"></canvas></div>
    <div class="out" id="gOut" style="font-family:ui-monospace,Consolas,monospace;font-size:13px">x = –, y = –</div>
  </div>
</section>

<!-- MATRITSA -->
<section class="tab" id="tab-matrix">
  <div class="card">
    <div class="grid2">
      <div><label style="margin-top:0">Matritsa A (qatorlar yangi qatorda, elementlar bo'sh joy bilan)</label><textarea id="mA">2 1 -1
-3 -1 2
-2 1 2</textarea></div>
      <div><label style="margin-top:0">Matritsa B (yoki vektor)</label><textarea id="mB">8
-11
-3</textarea></div>
    </div>
    <div class="row"><div style="max-width:160px"><label>Daraja n (Aⁿ uchun)</label><input type="text" id="mN" value="2"></div></div>
    <div class="btns">
      <button class="btn" data-m="add">A + B</button>
      <button class="btn" data-m="sub">A − B</button>
      <button class="btn" data-m="mul">A × B</button>
      <button class="btn" data-m="det">det(A)</button>
      <button class="btn" data-m="inv">A⁻¹</button>
      <button class="btn" data-m="tr">Aᵀ</button>
      <button class="btn" data-m="pow">Aⁿ</button>
      <button class="btn" data-m="rref">Pog'onali (RREF)</button>
      <button class="btn" data-m="rank">Rang</button>
      <button class="btn" data-m="eig">Xos qiymatlar</button>
      <button class="btn alt" data-m="solve">A·X = B ni yechish</button>
    </div>
    <div class="out" id="mOut"></div>
  </div>
</section>

<!-- STATISTIKA -->
<section class="tab" id="tab-stats">
  <div class="card">
    <label style="margin-top:0">Sonlar (vergul, bo'sh joy yoki yangi qator bilan)</label>
    <textarea id="stIn">12, 15, 11, 18, 15, 20, 14, 15, 9, 22</textarea>
    <div class="btns"><button class="btn" id="stBtn">Hisoblash</button></div>
    <div class="out" id="stOut"></div>
  </div>
</section>

<!-- SONLAR -->
<section class="tab" id="tab-number">
  <div class="card">
    <label style="margin-top:0">Butun son(lar): bitta yoki bir nechta (vergul bilan)</label>
    <input type="text" id="nIn" value="360, 84">
    <div class="btns"><button class="btn" id="nBtn">Tahlil qilish</button></div>
    <div class="out" id="nOut"></div>
  </div>
</section>

</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tex = s => { try { return katex.renderToString(s, {throwOnError:false, displayMode:true}); } catch(e){ return '<code>'+esc(s)+'</code>'; } };
const errBox = e => `<span class="err">Xatolik: ${esc(e && e.message ? e.message : e)}</span>`;

/* ---------- Tabs ---------- */
$('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + b.dataset.t));
  if (b.dataset.t === 'graph') { resizeCanvas(); draw(); }
});

/* ---------- Helpers ---------- */
function normalize(s){
  return String(s).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'pi')
    .replace(/√\s*\(/g,'sqrt(').replace(/√\s*([0-9.a-z]+)/gi,'sqrt($1)').replace(/²/g,'^2').replace(/³/g,'^3')
    .replace(/∞/g,'Infinity');
}
function fmt(v, p=12){
  try { return math.format(v, {precision:p}); } catch(e){ return String(v); }
}
function splitTop(s){ // "[a,b,(c,d)]" ni yuqori darajadagi vergullar bo'yicha bo'lish
  s = s.trim(); if (s.startsWith('[') && s.endsWith(']')) s = s.slice(1,-1);
  const out=[]; let d=0, cur='';
  for (const ch of s){ if ('([{'.includes(ch)) d++; if (')]}'.includes(ch)) d--; if (ch===',' && d===0){ out.push(cur); cur=''; } else cur+=ch; }
  if (cur.trim()) out.push(cur); return out.map(x=>x.trim()).filter(Boolean);
}
function nTex(expr){ try { return nerdamer.convertToLaTeX(String(expr)); } catch(e){ try { return math.parse(expr).toTex(); } catch(_) { return String(expr); } } }
function approx(expr){
  try {
    const v = math.evaluate(String(expr));
    if (typeof v === 'number' || math.typeOf(v) === 'Complex') return fmt(v, 10);
  } catch(e){}
  try { const t = nerdamer(expr).evaluate().text('decimals', 10); return /^[-+0-9.e*i ()]+$/.test(t) ? t : null; } catch(e){ return null; }
}
function toFractionStr(x){
  if (typeof x !== 'number' || !isFinite(x) || Number.isInteger(x)) return null;
  try { const f = math.fraction(x); if (f.d <= 10000 && Math.abs(f.valueOf() - x) < 1e-12) return (f.s<0?'-':'') + f.n + '/' + f.d; } catch(e){}
  return null;
}

/* ---------- math.js: DEG / RAD ---------- */
const mathRad = math;
const mathDeg = math.create(math.all);
const extra = {
  ln: x => math.log(x),
  root: (x, n) => (x < 0 && n % 2 === 1) ? -Math.pow(-x, 1/n) : Math.pow(x, 1/n),
  nCr: (n,k) => math.combinations(n,k), nPr: (n,k) => math.permutations(n,k)
};
(() => {
  const d = Math.PI/180;
  const clean = v => Math.abs(v) < 1e-14 ? 0 : (Math.abs(v - Math.round(v)) < 1e-13 ? Math.round(v) : v);
  const wrap = f => mathDeg.typed({ 'number': x => f(x), 'BigNumber': x => f(x.toNumber()) });
  mathDeg.import({
    sin: wrap(x => clean(Math.sin(x*d))), cos: wrap(x => clean(Math.cos(x*d))),
    tan: wrap(x => { const c = Math.cos(x*d); if (Math.abs(c) < 1e-15) return Infinity; return clean(Math.tan(x*d)); }),
    cot: wrap(x => clean(1/Math.tan(x*d))), sec: wrap(x => clean(1/Math.cos(x*d))), csc: wrap(x => clean(1/Math.sin(x*d))),
    asin: wrap(x => clean(Math.asin(x)/d)), acos: wrap(x => clean(Math.acos(x)/d)), atan: wrap(x => clean(Math.atan(x)/d)),
    acot: wrap(x => clean(Math.atan(1/x)/d)),
    atan2: (y,x) => clean(Math.atan2(y,x)/d)
  }, {override:true});
})();
mathRad.import(extra, {override:true}); mathDeg.import(extra, {override:true});
const bigMath = math.create(math.all); bigMath.config({number:'BigNumber', precision:1000});

/* ---------- Kalkulyator ---------- */
let angleMode = 'deg';
const scope = new Map();
$('angle').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; angleMode = b.dataset.a;
  document.querySelectorAll('#angle button').forEach(x => x.classList.toggle('on', x === b));
  livePreview();
});
const keys = [
  ['7'],['8'],['9'],['÷','/','op'],['('],[')'],['AC','AC','clr'],
  ['4'],['5'],['6'],['×','*','op'],['sin','sin('],['cos','cos('],['⌫','BS','clr'],
  ['1'],['2'],['3'],['−','-','op'],['tan','tan('],['√','sqrt('],['xʸ','^','op'],
  ['0'],['.'],['π','pi'],['+','+','op'],['ln','ln('],['log','log10('],['x²','^2','op'],
  ['e'],['i'],['!'],['%'],['x'],['=','=','op'],['ans'],
  [','],['abs','abs('],['n!','factorial('],['asin','asin('],['acos','acos('],['atan','atan('],['↵','ENTER','eq']
];
const kp = $('keypad');
keys.forEach(([label, val=label, cls='']) => {
  const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls;
  b.onclick = () => {
    const inp = $('calcIn');
    if (val === 'AC') { inp.value=''; $('calcDisplay').textContent=''; }
    else if (val === 'BS') { inp.value = inp.value.slice(0,-1); }
    else if (val === 'ENTER') { runCalc(); }
    else {
      const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? inp.value.length;
      inp.value = inp.value.slice(0,s) + val + inp.value.slice(en);
      inp.selectionStart = inp.selectionEnd = s + val.length;
    }
    inp.focus(); livePreview();
  };
  kp.appendChild(b);
});
const calcExamples = ['2^64','(3+4i)*(2-i)','sin(30)+cos(60)','100!','5 km to mile','98.6 degF to degC','sqrt(-16)','1/3+1/6','det([1,2;3,4])','f(x)=x^2+1','f(5)','2x+3=11','x^2-2x-8=0','derivative("x^3+2x","x")','log(1000,10)','nCr(10,3)','480*25/100','e^(i*pi)','12.5 kg to lb','gcd(84,360)'];
$('calcEx').innerHTML = calcExamples.map(x => `<span class="chip">${esc(x)}</span>`).join('');
$('calcEx').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; $('calcIn').value = c.textContent; runCalc(); };

function isEquation(s){
  if (!/[^=<>!]=[^=]/.test(' '+s+' ')) return false;
  const m = s.match(/^\s*([a-zA-Z_]\w*)\s*(\([^()]*\))?\s*=([^=].*)$/);
  if (m) {
    // "a = 5" yoki "f(x)=..." -> o'zlashtirish; o'ng tomonda shu o'zgaruvchi bo'lsa -> tenglama
    if (!m[2] && new RegExp('\\b'+m[1]+'\\b').test(m[3])) return true;
    return false;
  }
  return true;
}
function evalCalc(src){
  const m = angleMode === 'deg' ? mathDeg : mathRad;
  return m.evaluate(src, scope);
}
function livePreview(){
  const s = normalize($('calcIn').value.trim());
  if (!s || /=/.test(s)) { $('calcDisplay').textContent=''; return; }
  try { const v = evalCalc(s); if (typeof v !== 'function' && v !== undefined) $('calcDisplay').textContent = fmt(v); } catch(e){ $('calcDisplay').textContent=''; }
}
$('calcIn').addEventListener('input', livePreview);
$('calcIn').addEventListener('keydown', e => { if (e.key === 'Enter') runCalc(); });

const history = [];
function runCalc(){
  const raw = $('calcIn').value.trim(); if (!raw) return;
  const s = normalize(raw);
  let html = '', short = '';
  try {
    if (isEquation(s)) {
      const r = solveSmart(s, '');
      html = r.html; short = r.short;
    } else {
      const v = evalCalc(s);
      if (typeof v === 'function') { html = `<span class="ok">Funksiya aniqlandi: ${esc(raw)}</span>`; short = 'funksiya aniqlandi'; }
      else {
        scope.set('ans', v);
        const str = fmt(v, 14);
        const parts = [];
        try { parts.push(tex(math.parse(s).toTex({parenthesis:'auto'}))); } catch(e){}
        parts.push(`<div class="ok" style="font-size:20px;word-break:break-all">= ${esc(str)}</div>`);
        const fr = toFractionStr(v); if (fr) parts.push(`<div>Oddiy kasr: <b>${fr}</b></div>`);
        if (typeof v === 'number' && Number.isInteger(v) && Math.abs(v) < 1e15 && Math.abs(v) > 1) {
          parts.push(`<div style="color:var(--muted);font-size:13px">Bin: ${v.toString(2)} · Hex: ${v.toString(16).toUpperCase()} · Oct: ${v.toString(8)}</div>`);
        }
        // juda katta sonlar uchun aniq (BigNumber) qiymat
        if (typeof v === 'number' && Number.isInteger(v) && Math.abs(v) >= 1e15) {
          try { const bv = bigMath.evaluate(s); if (bigMath.typeOf(bv) === 'BigNumber' && bv.isInteger()) parts.push(`<h4>Aniq qiymat:</h4><div style="word-break:break-all;font-family:ui-monospace,Consolas,monospace">${esc(bv.toFixed())}</div>`); } catch(_){}
        }
        html = parts.join(''); short = str;
      }
    }
    $('calcDisplay').textContent = short.length < 60 ? short : '';
  } catch(e){ html = errBox(e); short = ''; }
  $('calcOut').innerHTML = html;
  if (short) { history.unshift([raw, short]); renderHist(); }
}
function renderHist(){
  $('hist').innerHTML = history.slice(0,50).map(([a,b],i) => `<div data-i="${i}">${esc(a)}<br><b>= ${esc(b)}</b></div>`).join('');
}

function toZero(eq){

function numericRoots(expr, v, lo=-1000, hi=1000){

}

function simpson(f, a, b, n=4000){

  const safe = x => { const y = f(x); return isFinite(y) ? y : (isFinite(f(x + 1e-9)) ? f(x + 1e-9) : f(x - 1e-9)); };

    try { const c = mathRad.compile(src); return { src: s, f: x => { try { const r = c.evaluate({x}); return typeof r === 'number' ? r : NaN; } catch(e){ return NaN; } }, color: colors[i % colors.length] }; }
    catch(e){ return { src: s, err: e.message, color: colors[i % colors.length] }; }
  });
}
function draw(){
  const W = cv.clientWidth, H = cv.clientHeight; if (!W) return;
  const X = x => W/2 + (x - view.cx) * view.sc, Y = y => H/2 - (y - view.cy) * view.sc;
  const iX = px => (px - W/2) / view.sc + view.cx;
  ctx.fillStyle = '#0b0e1a'; ctx.fillRect(0,0,W,H);
  let st = 80 / view.sc; const p = Math.pow(10, Math.floor(Math.log10(st))); const n = st/p; st = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
  ctx.lineWidth = 1; ctx.font = '11px system-ui';
  const lbl = v => +v.toPrecision(6);
  for (let x = Math.floor(iX(0)/st)*st; x <= iX(W); x += st) {
    const axis = Math.abs(x) < st/2; ctx.strokeStyle = axis ? '#8890c0' : '#1c2140';
    ctx.beginPath(); ctx.moveTo(X(x),0); ctx.lineTo(X(x),H); ctx.stroke();
    if (!axis) { ctx.fillStyle = '#7880a8'; ctx.fillText(lbl(x), X(x)+2, Math.min(H-4, Math.max(12, Y(0)+12))); }
  }
  const yTop = view.cy + H/2/view.sc, yBot = view.cy - H/2/view.sc;
  for (let y = Math.floor(yBot/st)*st; y <= yTop; y += st) {
    const axis = Math.abs(y) < st/2; ctx.strokeStyle = axis ? '#8890c0' : '#1c2140';
    ctx.beginPath(); ctx.moveTo(0,Y(y)); ctx.lineTo(W,Y(y)); ctx.stroke();
    if (!axis) { ctx.fillStyle = '#7880a8'; ctx.fillText(lbl(y), Math.min(W-40, Math.max(2, X(0)+4)), Y(y)-2); }
  }
  fns.forEach((fn, i) => {
    if (fn.err) return;
    ctx.strokeStyle = fn.color; ctx.lineWidth = 2; ctx.beginPath(); let pen = false, py = null;
    for (let px = 0; px <= W; px += 0.5) {
      const y = fn.f(iX(px)), sy = Y(y);
      if (!isFinite(y) || (py !== null && Math.abs(sy - py) > H*2)) { pen = false; py = isFinite(y) ? sy : null; continue; }
      if (!pen) { ctx.moveTo(px, sy); pen = true; } else ctx.lineTo(px, sy); py = sy;
    }
    ctx.stroke();
    ctx.fillStyle = fn.color; ctx.font = '13px system-ui'; ctx.fillText('y = ' + fn.src, 10, 20 + i*18);
  });
  fns.filter(f => f.err).forEach((f, i) => { ctx.fillStyle = '#ff6b81'; ctx.fillText('Xato: ' + f.src, 10, H - 10 - i*16); });
}
let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy }; cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing'; });
cv.addEventListener('pointerup', () => { drag = null; cv.style.cursor='grab'; });
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const x = (mx - r.width/2)/view.sc + view.cx, y = -(my - r.height/2)/view.sc + view.cy;
  $('gOut').innerHTML = `x = ${x.toFixed(4)}, y = ${y.toFixed(4)}` + fns.filter(f=>!f.err).map(f => ` &nbsp;|&nbsp; <span style="color:${f.color}">${esc(f.src)} = ${esc(fmt(f.f(x), 6))}</span>`).join('');
  if (drag) { view.cx = drag.cx - (e.clientX - drag.x)/view.sc; view.cy = drag.cy + (e.clientY - drag.y)/view.sc; draw(); }
});
cv.addEventListener('wheel', e => {
  e.preventDefault(); const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const x = (mx - r.width/2)/view.sc + view.cx, y = -(my - r.height/2)/view.sc + view.cy;
  const k = e.deltaY < 0 ? 1.15 : 1/1.15; view.sc = Math.min(1e6, Math.max(1e-4, view.sc * k));
  view.cx = x - (mx - r.width/2)/view.sc; view.cy = y + (my - r.height/2)/view.sc; draw();
}, { passive: false });
$('gBtn').onclick = () => { compileFns(); draw(); };
$('gIn').addEventListener('keydown', e => { if (e.key === 'Enter') { compileFns(); draw(); } });
$('gReset').onclick = () => { view = { cx: 0, cy: 0, sc: 50 }; draw(); };
window.addEventListener('resize', () => { resizeCanvas(); draw(); });
compileFns();

/* ---------- Matritsa ---------- */
function parseMatrix(t){
  t = normalize(t.trim()); if (!t) throw new Error("Matritsa bo'sh");
  if (t.startsWith('[')) return math.matrix(mathRad.evaluate(t)).toArray();
  return t.split(/\n|;/).map(r => r.trim()).filter(Boolean).map(r => r.split(/[\s,]+/).filter(Boolean).map(x => mathRad.evaluate(x)));
}
function rref(M){
  const A = M.map(r => r.map(Number)); const R = A.length, C = A[0].length; let lead = 0;
  for (let r = 0; r < R; r++) {
    if (lead >= C) break; let i = r;
    while (Math.abs(A[i][lead]) < 1e-12) { i++; if (i === R) { i = r; lead++; if (lead === C) return A.map(r => r.map(x => Math.abs(x) < 1e-12 ? 0 : x)); } }
    [A[i], A[r]] = [A[r], A[i]]; const lv = A[r][lead]; A[r] = A[r].map(x => x / lv);
    for (let j = 0; j < R; j++) if (j !== r) { const f = A[j][lead]; A[j] = A[j].map((x, k) => x - f * A[r][k]); }
    lead++;
  }
  return A.map(r => r.map(x => Math.abs(x) < 1e-12 ? 0 : x));
}
function cellTex(x){
  if (typeof x === 'number') {
    if (Math.abs(x - Math.round(x)) < 1e-10) return String(Math.round(x));
    const f = toFractionStr(x); if (f) { const neg = f.startsWith('-'); const [nn, dd] = f.replace('-','').split('/'); return (neg ? '-' : '') + `\\tfrac{${nn}}{${dd}}`; }
  }
  return fmt(x, 8);
}
function mTex(M){
  if (!Array.isArray(M)) return cellTex(M);
  if (!Array.isArray(M[0])) M = M.map(x => [x]);
  return '\\begin{bmatrix}' + M.map(r => r.map(cellTex).join(' & ')).join('\\\\') + '\\end{bmatrix}';
}
document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
  let html = '';
  try {
    const A = parseMatrix($('mA').value); const getB = () => parseMatrix($('mB').value);
    const op = b.dataset.m;
    const arr = R => math.typeOf(R) === 'Matrix' ? R.toArray() : R;
    const show = (lhs, R) => html = tex(lhs + ' = ' + mTex(arr(R)));
    if (op === 'add') show('A + B', math.add(A, getB()));
    else if (op === 'sub') show('A - B', math.subtract(A, getB()));
    else if (op === 'mul') show('A \\times B', math.multiply(A, getB()));
    else if (op === 'det') html = tex(`\\det(A) = ${cellTex(math.det(A))}`);
    else if (op === 'inv') show('A^{-1}', math.inv(A));
    else if (op === 'tr') show('A^{T}', math.transpose(A));
    else if (op === 'pow') { const n = parseInt($('mN').value) || 2; show(`A^{${n}}`, n < 0 ? math.pow(math.inv(A), -n) : math.pow(A, n)); }
    else if (op === 'rref') show('\\mathrm{RREF}(A)', rref(A));
    else if (op === 'rank') html = tex(`\\mathrm{rank}(A) = ${rref(A).filter(r => r.some(x => Math.abs(x) > 1e-10)).length}`);
    else if (op === 'eig') {
      const r = math.eigs(A); const vals = arr(r.values);
      html = '<h4>Xos qiymatlar:</h4>' + tex('\\lambda = ' + vals.map(v => typeof v === 'number' ? cellTex(v) : fmt(v, 10)).join(',\\; '));
      try { if (r.eigenvectors) html += '<h4>Xos vektorlar (eng katta elementi 1 ga keltirilgan):</h4>' + tex(r.eigenvectors.map(e => {
        let vec = arr(e.vector);
        if (vec.every(x => typeof x === 'number')) { const m = vec.reduce((p, x) => Math.abs(x) > Math.abs(p) ? x : p, 0); if (m) vec = vec.map(x => +(x / m).toPrecision(8)); }
        return mTex(vec);
      }).join('\\;')); } catch(_){}
    }
    else if (op === 'solve') html = tex('X = ' + mTex(arr(math.lusolve(A, getB()))));
  } catch(e){ html = errBox(e); }
  $('mOut').innerHTML = html;
});

/* ---------- Statistika ---------- */
$('stBtn').onclick = () => {
  try {
    const a = $('stIn').value.split(/[\s,;]+/).filter(Boolean).map(x => { const v = mathRad.evaluate(normalize(x)); if (typeof v !== 'number') throw new Error('Son emas: ' + x); return v; });
    if (!a.length) throw new Error("Sonlar kiriting");

    const rows = [

      ['Moda', math.mode(a).join(', ')], ['Minimum', s[0]], ['Maksimum', s[s.length-1]], ['Qamrov (max − min)', s[s.length-1]-s[0]],
      ['Q1 (25%)', math.quantileSeq(a, 0.25)], ['Q3 (75%)', math.quantileSeq(a, 0.75)],
      ['Dispersiya (tanlanma)', a.length > 1 ? math.variance(a) : '-'], ["Dispersiya (to'plam)", math.variance(a, 'uncorrected')],
      ['Standart chetlanish (tanlanma)', a.length > 1 ? math.std(a) : '-'], ["Standart chetlanish (to'plam)", math.std(a, 'uncorrected')],
      ["O'rta geometrik", s[0] > 0 ? Math.exp(math.mean(a.map(Math.log))) : '-'], ["O'rta garmonik", s[0] > 0 ? a.length / math.sum(a.map(x => 1/x)) : '-'],
      ["Mediana absolyut chetlanish (MAD)", math.mad(a)], ["Kvadratlar yig'indisi", math.sum(a.map(x => x*x))], ['Saralangan', s.join(', ')]
    ];
    $('stOut').innerHTML = '<table>' + rows.map(([k,v]) => `<tr><td>${k}</td><td><b>${esc(typeof v === 'number' ? fmt(v, 10) : v)}</b></td></tr>`).join('') + '</table>';
  } catch(e){ $('stOut').innerHTML = errBox(e); }
};

/* ---------- Sonlar nazariyasi ---------- */
function isPrimeBig(n){
  if (n < 2n) return false;
  for (const p of [2n,3n,5n,7n,11n,13n,17n,19n,23n,29n,31n,37n]) { if (n === p) return true; if (n % p === 0n) return false; }
  let d = n - 1n, r = 0n; while (d % 2n === 0n) { d /= 2n; r++; }
  const pw = (b, e, m) => { let res = 1n; b %= m; while (e > 0n) { if (e & 1n) res = res*b % m; b = b*b % m; e >>= 1n; } return res; };
  outer: for (const a of [2n,3n,5n,7n,11n,13n,17n,19n,23n,29n,31n,37n]) {
    let x = pw(a, d, n); if (x === 1n || x === n-1n) continue;
    for (let i = 1n; i < r; i++) { x = x*x % n; if (x === n-1n) continue outer; }
    return false;
  }
  return true;
}
function factorBig(n){
  const f = new Map(); const add = p => f.set(p, (f.get(p) || 0) + 1);
  const gcd = (a,b) => { while (b) [a,b] = [b, a%b]; return a < 0n ? -a : a; };
  const rho = n => { if (n % 2n === 0n) return 2n; for (let c = 1n; ; c++) { let x = 2n, y = 2n, d = 1n; const g = v => (v*v + c) % n; while (d === 1n) { x = g(x); y = g(g(y)); d = gcd(x > y ? x-y : y-x, n); } if (d !== n) return d; } };
  const rec = n => { if (n === 1n) return; if (isPrimeBig(n)) { add(n); return; } for (const p of [2n,3n,5n,7n,11n,13n]) if (n % p === 0n) { add(p); rec(n/p); return; } const d = rho(n); rec(d); rec(n/d); };
  rec(n); return [...f.entries()].sort((a,b) => a[0] < b[0] ? -1 : 1);
}
$('nBtn').onclick = () => {
  try {
    const nums = $('nIn').value.split(/[\s,;]+/).filter(Boolean).map(x => { if (!/^-?\d+$/.test(x)) throw new Error('Butun son emas: ' + x); return BigInt(x); });
    if (!nums.length) throw new Error('Son kiriting');
    let html = '';
    const gcd = (a,b) => { a = a<0n?-a:a; b = b<0n?-b:b; while (b) [a,b] = [b, a%b]; return a; };
    nums.forEach(n => {
      const abs = n < 0n ? -n : n;
      html += `<h4>n = ${n}</h4><table>`;
      html += `<tr><td>Tub sonmi?</td><td><b>${isPrimeBig(abs) ? 'Ha, tub son' : "Yo'q"}</b></td></tr>`;
      if (abs > 1n) {
        const fs = factorBig(abs);
        html += `<tr><td>Tub ko'paytuvchilar</td><td>${tex(fs.map(([p,e]) => e > 1 ? `${p}^{${e}}` : `${p}`).join(' \\cdot '))}</td></tr>`;
        const cnt = fs.reduce((s,[,e]) => s * (e+1), 1);
        html += `<tr><td>Bo'luvchilar soni</td><td><b>${cnt}</b></td></tr>`;
        if (cnt <= 500) {
          let divs = [1n]; fs.forEach(([p,e]) => { const nd = []; divs.forEach(d => { let m = 1n; for (let i = 0; i <= e; i++) { nd.push(d*m); m *= p; } }); divs = nd; }); divs.sort((a,b) => a<b?-1:a>b?1:0);
          const sum = divs.reduce((a,b)=>a+b,0n);
          html += `<tr><td>Bo'luvchilar</td><td>${divs.join(', ')}</td></tr><tr><td>Bo'luvchilar yig'indisi</td><td>${sum}</td></tr>`;
          html += `<tr><td>Mukammal sonmi?</td><td>${sum - abs === abs ? 'Ha' : "Yo'q"}</td></tr>`;
        }
        let phi = abs; fs.forEach(([p]) => phi = phi / p * (p - 1n)); html += `<tr><td>Eyler funksiyasi φ(n)</td><td>${phi}</td></tr>`;
      }
      html += `<tr><td>Ikkilik / sakkizlik / o'n oltilik</td><td style="word-break:break-all">${n.toString(2)} / ${n.toString(8)} / ${n.toString(16).toUpperCase()}</td></tr>`;
      if (abs <= 3999n && abs > 0n) { const R = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; let k = Number(abs), s = ''; R.forEach(([v,c]) => { while (k >= v) { s += c; k -= v; } }); html += `<tr><td>Rim raqamida</td><td>${s}</td></tr>`; }
      if (abs <= 1000n) { let f = 1n; for (let i = 2n; i <= abs; i++) f *= i; html += `<tr><td>n!</td><td style="word-break:break-all">${f}</td></tr>`; }
      const sqrtBig = v => { if (v < 2n) return v; let x = BigInt(Math.floor(Math.sqrt(Number(v)))); while (x*x > v) x--; while ((x+1n)*(x+1n) <= v) x++; return x; };
      const sq = sqrtBig(abs); html += `<tr><td>To'liq kvadratmi?</td><td>${sq*sq === abs ? 'Ha (' + sq + '²)' : "Yo'q"}</td></tr>`;
      html += '</table>';
    });
    if (nums.length > 1) {
      const g = nums.reduce(gcd); const l = nums.reduce((a,b) => { const x = a<0n?-a:a, y = b<0n?-b:b; return x / gcd(x,y) * y; });
      html = `<table><tr><td>EKUB (gcd)</td><td><b class="ok">${g}</b></td></tr><tr><td>EKUK (lcm)</td><td><b class="ok">${l}</b></td></tr><tr><td>O'zaro tubmi?</td><td>${g === 1n ? 'Ha' : "Yo'q"}</td></tr></table>` + html;
    }
    $('nOut').innerHTML = html;
  } catch(e){ $('nOut').innerHTML = errBox(e); }
};
